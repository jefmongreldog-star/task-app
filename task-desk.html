<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myタスク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+JP:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1F3EC;
    --paper-deep: #E5E8DE;
    --card: #FFFFFF;
    --ink: #23261F;
    --ink-soft: #565C52;
    --line: #C7CBBF;
    --teal: #3E6259;
    --teal-soft: #E4EEEA;
    --amber: #C2903A;
    --amber-soft: #F5EBD8;
    --slate: #5C6F8A;
    --slate-soft: #E7EBF1;
    --clay: #B15A3E;
    --seal: #A83B32;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image:
      linear-gradient(rgba(216, 220, 209, 0.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(216, 220, 209, 0.6) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    color: var(--ink);
    font-family: 'IBM Plex Sans JP', sans-serif;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .app { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 40px;
    margin: 4px 0 2px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--ink-soft); font-size: 14px; margin: 0; }

  /* progress rings */
  .progress-box { display: flex; gap: 10px; flex-wrap: wrap; }
  .progress-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 16px;
    box-shadow: 0 1px 0 var(--line);
  }
  .ring { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); width: 52px; height: 52px; }
  .ring-track { fill: none; stroke: var(--paper-deep); stroke-width: 6; }
  .ring-fill { fill: none; stroke: var(--teal); stroke-width: 6; stroke-linecap: round; transition: stroke-dasharray 0.4s; }
  .progress-card.type-onetime .ring-fill { stroke: var(--slate); }
  .progress-card.type-monthly .ring-fill { stroke: var(--amber); }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; font-weight: 500; color: var(--ink);
  }
  .progress-text { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .progress-text .label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--ink-soft); text-transform: uppercase; display: block; margin-bottom: 2px; }
  .progress-text b { color: var(--ink); font-family: 'IBM Plex Mono', monospace; }

  /* type toggle */
  .type-toggle { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .type-toggle button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 7px 14px;
    border: none;
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    border-right: 1px solid var(--line);
  }
  .type-toggle button:last-child { border-right: none; }
  .type-toggle button.active.t-onetime { background: var(--slate-soft); color: var(--slate); font-weight: 500; }
  .type-toggle button.active.t-monthly { background: var(--amber-soft); color: #8A5F1F; font-weight: 500; }

  .add-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 26px;
    box-shadow: 0 1px 0 var(--line);
  }
  .add-row1 { display: flex; gap: 8px; margin-bottom: 10px; }
  .add-row1 input[type=text] {
    flex: 1;
    font-family: 'IBM Plex Sans JP', sans-serif;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--ink);
  }
  .add-row1 input[type=text]:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .add-row2, .add-row3 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .add-row2 select, .add-row3 select,
  .add-row2 input[type=date], .add-row2 input[type=number], .add-row2 input[type=text], .add-row3 input[type=text] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--ink-soft);
  }
  .add-row2 input[type=number] { width: 68px; }
  .field-hint { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }
  .add-btn {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 8px 18px;
    background: var(--ink);
    color: var(--card);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .add-btn:hover { background: var(--teal); }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filters button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .filters button.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--card);
  }

  .list { display: flex; flex-direction: column; gap: 12px; }

  .ticket {
    display: flex;
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 0 var(--line);
    transition: opacity 0.2s;
  }
  .ticket.done { opacity: 0.75; }

  .stub {
    width: 76px;
    flex-shrink: 0;
    background: var(--slate-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    position: relative;
    border-right: 1px dashed var(--line);
  }
  .stub::before, .stub::after {
    content: "";
    position: absolute;
    width: 12px; height: 12px;
    background: var(--paper);
    border-radius: 50%;
    right: -6px;
  }
  .stub::before { top: -6px; }
  .stub::after { bottom: -6px; }
  .stub.p-high { background: #F1DED3; }
  .stub.p-medium { background: var(--slate-soft); }
  .stub.p-low { background: var(--teal-soft); }
  .stub-letter {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
  }
  .p-high .stub-letter { color: var(--clay); }
  .p-medium .stub-letter { color: var(--slate); }
  .p-low .stub-letter { color: var(--teal); }
  .stub-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.3;
  }

  .body { flex: 1; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .check {
    margin-top: 3px;
    width: 18px; height: 18px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
  }
  .check.checked { background: var(--teal); border-color: var(--teal); }
  .check.checked::after {
    content: "";
    position: absolute;
    left: 5px; top: 1.5px;
    width: 4px; height: 8px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; color: var(--ink); word-break: break-word; }
  .ticket.done .task-title { text-decoration: line-through; color: var(--ink-soft); }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    background: var(--paper-deep);
    padding: 2px 7px;
    border-radius: 999px;
  }
  .tag.type-monthly { background: var(--amber-soft); color: #8A5F1F; }
  .tag.type-onetime { background: var(--slate-soft); color: var(--slate); }

  .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .del, .ics-btn {
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
  }
  .del { color: var(--ink-soft); font-size: 16px; }
  .del:hover { color: var(--clay); }
  .ics-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--teal);
    border: 1px solid var(--teal);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }
  .ics-btn:hover { background: var(--teal-soft); }

  /* hanko stamp */
  .stamp {
    position: absolute;
    top: 10px; right: 84px;
    width: 46px; height: 46px;
    border: 2.5px solid var(--seal);
    border-radius: 6px;
    color: var(--seal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 20px;
    transform: rotate(-8deg);
    opacity: 0.85;
    mix-blend-mode: multiply;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 30%, transparent 60%, rgba(168,59,50,0.08) 100%);
  }
  @media (max-width: 480px) {
    .stamp { right: 8px; top: 4px; width: 38px; height: 38px; font-size: 16px; }
  }
  .stamp.stamp-anim {
    animation: stampHit 0.55s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }
  @keyframes stampHit {
    0%   { transform: scale(3.2) rotate(-8deg); opacity: 0; }
    55%  { transform: scale(0.85) rotate(-8deg); opacity: 1; }
    72%  { transform: scale(1.05) rotate(-8deg); opacity: 0.9; }
    100% { transform: scale(1) rotate(-8deg); opacity: 0.85; }
  }
  .ticket.stamping .check { pointer-events: none; opacity: 0.5; }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty .big { font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); margin-bottom: 6px; }
  .count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }

  /* custom confirm modal (native confirm() is blocked in this sandbox) */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(35, 38, 31, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 22px;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 6px 24px rgba(35,38,31,0.2);
  }
  .modal-box p {
    font-size: 14.5px;
    color: var(--ink);
    margin: 0 0 18px;
    line-height: 1.6;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .modal-cancel { background: #fff; border: 1px solid var(--line); color: var(--ink-soft); }
  .modal-confirm { background: var(--clay); border: 1px solid var(--clay); color: #fff; }
  .modal-box-wide { max-width: 380px; }
  .modal-box-wide p { font-weight: 600; font-family: 'Fraunces', serif; font-size: 18px; }
  .edit-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .edit-form input[type=text], .edit-form input[type=date], .edit-form input[type=number], .edit-form select {
    font-family: 'IBM Plex Sans JP', sans-serif;
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  .edit-form .type-toggle { align-self: flex-start; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">TASK DESK — 001</div>
      <h1>Myタスク管理</h1>
      <p class="sub">毎日・毎月のタスクを簡単管理</p>
    </div>
    <div class="progress-box">
      <div class="progress-card type-onetime">
        <div class="ring">
          <svg viewBox="0 0 52 52">
            <circle class="ring-track" cx="26" cy="26" r="22"></circle>
            <circle class="ring-fill" id="ringFillOnetime" cx="26" cy="26" r="22"></circle>
          </svg>
          <div class="ring-label" id="ringLabelOnetime">0%</div>
        </div>
        <div class="progress-text"><span class="label">単発</span><span id="progressTextOnetime">タスクなし</span></div>
      </div>
      <div class="progress-card type-monthly">
        <div class="ring">
          <svg viewBox="0 0 52 52">
            <circle class="ring-track" cx="26" cy="26" r="22"></circle>
            <circle class="ring-fill" id="ringFillMonthly" cx="26" cy="26" r="22"></circle>
          </svg>
          <div class="ring-label" id="ringLabelMonthly">0%</div>
        </div>
        <div class="progress-text"><span class="label">月次</span><span id="progressTextMonthly">タスクなし</span></div>
      </div>
    </div>
  </header>

  <div class="add-card">
    <div class="add-row1">
      <input type="text" id="titleInput" placeholder="なにをする?" maxlength="120">
    </div>
    <div class="add-row2">
      <select id="tagSelect"></select>
      <input type="text" id="tagInput" placeholder="新しいタグを入力" style="display:none; width:110px;">
      <div class="type-toggle" id="typeToggle">
        <button type="button" class="t-onetime active" data-type="onetime">単発</button>
        <button type="button" class="t-monthly" data-type="monthly">月次</button>
      </div>
      <input type="date" id="dueInput" title="単発タスクの締め切り日">
      <input type="number" id="monthDayInput" min="1" max="31" placeholder="毎月◯日" style="display:none;" title="月次タスクの締め切り日(1〜31)">
      <select id="priorityInput">
        <option value="medium">優先度: A(重要)</option>
        <option value="high">優先度: S(最優先)</option>
        <option value="low">優先度: B(通常)</option>
      </select>
    </div>
    <div class="add-row3">
      <select id="methodSelect"></select>
      <input type="text" id="methodInput" placeholder="新しい方法を入力" style="display:none; width:150px;">
      <input type="text" id="submitToInput" placeholder="提出先(任意)" style="width:130px;">
      <button class="add-btn" id="addBtn">追加する</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
</div>

<script>
const FILTERS = [
  { key: 'active', label: 'やること' },
  { key: 'today', label: '今日まで' },
  { key: 'monthly', label: '月次のみ' },
  { key: 'onetime', label: '単発のみ' },
  { key: 'all', label: 'すべて' },
  { key: 'done', label: '完了' },
];
const PRIORITY_LABEL = { high: 'S', medium: 'A', low: 'B' };
const TYPE_LABEL = { monthly: '月次', onetime: '単発' };

let tasks = [];
let currentFilter = 'active';
let selectedType = 'onetime';

function setSelectedType(type) {
  selectedType = type;
  document.querySelectorAll('#typeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });
  const isMonthly = type === 'monthly';
  document.getElementById('dueInput').style.display = isMonthly ? 'none' : '';
  document.getElementById('monthDayInput').style.display = isMonthly ? '' : 'none';
}

document.querySelectorAll('#typeToggle button').forEach(b => {
  b.addEventListener('click', () => setSelectedType(b.dataset.type));
});

// Claude上ではwindow.storageを、外部で単体ホスティングした場合はlocalStorageを使う
const hasClaudeStorage = typeof window.storage !== 'undefined';

async function loadTasks() {
  try {
    if (hasClaudeStorage) {
      const res = await window.storage.get('tasks', false);
      tasks = res ? JSON.parse(res.value) : [];
    } else {
      const raw = localStorage.getItem('taskdesk_tasks');
      tasks = raw ? JSON.parse(raw) : [];
    }
  } catch (e) {
    tasks = [];
  }
  render();
}

async function saveTasks() {
  try {
    if (hasClaudeStorage) {
      await window.storage.set('tasks', JSON.stringify(tasks), false);
    } else {
      localStorage.setItem('taskdesk_tasks', JSON.stringify(tasks));
    }
  } catch (e) {
    console.error('保存に失敗しました', e);
  }
}

function pad(n) { return String(n).padStart(2, '0'); }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// resolves the next concrete due date for a task (Date object), or null
function resolveDueDate(task) {
  if (task.type === 'onetime') {
    if (!task.due) return null;
    return new Date(task.due + 'T00:00:00');
  } else {
    if (!task.monthDay) return null;
    const now = new Date();
    let d = new Date(now.getFullYear(), now.getMonth(), task.monthDay);
    if (d < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
      d = new Date(now.getFullYear(), now.getMonth() + 1, task.monthDay);
    }
    return d;
  }
}

function fmtDue(task) {
  if (task.type === 'monthly') {
    return task.monthDay ? `毎月${task.monthDay}日` : '日付なし';
  }
  if (!task.due) return '期限なし';
  const dt = resolveDueDate(task);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}

function isDueTodayOrPast(task) {
  const dt = resolveDueDate(task);
  if (!dt) return false;
  const t = new Date(); t.setHours(0,0,0,0);
  return dt <= t;
}

function renderFilters() {
  const el = document.getElementById('filters');
  el.innerHTML = '';
  FILTERS.forEach(f => {
    const btn = document.createElement('button');
    btn.textContent = f.label;
    if (f.key === currentFilter) btn.classList.add('active');
    btn.onclick = () => { currentFilter = f.key; render(); };
    el.appendChild(btn);
  });
}

function getFiltered() {
  if (currentFilter === 'all') return tasks;
  if (currentFilter === 'done') return tasks.filter(t => t.done);
  if (currentFilter === 'active') return tasks.filter(t => !t.done);
  if (currentFilter === 'today') return tasks.filter(t => !t.done && isDueTodayOrPast(t));
  if (currentFilter === 'monthly') return tasks.filter(t => t.type === 'monthly');
  if (currentFilter === 'onetime') return tasks.filter(t => t.type === 'onetime');
  return tasks;
}

function renderRing(fillId, labelId, textId, list) {
  const total = list.length;
  const done = list.filter(t => t.done).length;
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  const circumference = 2 * Math.PI * 22;
  const fill = document.getElementById(fillId);
  fill.style.strokeDasharray = `${circumference}`;
  fill.style.strokeDashoffset = `${circumference * (1 - pct / 100)}`;
  document.getElementById(labelId).textContent = `${pct}%`;
  document.getElementById(textId).innerHTML = total === 0
    ? 'タスクなし'
    : `完了 <b>${done}</b> / 全 <b>${total}</b> 件`;
}

function renderProgress() {
  renderRing('ringFillOnetime', 'ringLabelOnetime', 'progressTextOnetime', tasks.filter(t => t.type === 'onetime'));
  renderRing('ringFillMonthly', 'ringLabelMonthly', 'progressTextMonthly', tasks.filter(t => t.type === 'monthly'));
}

function populateSelect(selectId, newInputId, values, placeholderLabel) {
  const sel = document.getElementById(selectId);
  const prev = sel.value;
  const unique = [...new Set(values.filter(Boolean))];
  sel.innerHTML =
    `<option value="">${placeholderLabel}: 未選択</option>` +
    unique.map(v => `<option value="${v.replace(/"/g, '&quot;')}">${v}</option>`).join('') +
    `<option value="__new__">＋ 新しく登録する</option>`;
  if (unique.includes(prev) || prev === '') sel.value = prev;
}

function updateSelectOptions() {
  populateSelect('methodSelect', 'methodInput', tasks.map(t => t.method), '方法');
  populateSelect('tagSelect', 'tagInput', tasks.map(t => t.tag), 'タグ');
}

function wireNewOption(selectId, newInputId) {
  const sel = document.getElementById(selectId);
  const input = document.getElementById(newInputId);
  sel.addEventListener('change', () => {
    if (sel.value === '__new__') {
      input.style.display = '';
      input.focus();
    } else {
      input.style.display = 'none';
      input.value = '';
    }
  });
}
wireNewOption('methodSelect', 'methodInput');
wireNewOption('tagSelect', 'tagInput');

function readSelectValue(selectId, newInputId) {
  const sel = document.getElementById(selectId);
  if (sel.value === '__new__') return document.getElementById(newInputId).value.trim();
  return sel.value;
}

function showConfirmModal(message, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const p = document.createElement('p');
  p.textContent = message;
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'modal-cancel';
  cancelBtn.textContent = 'キャンセル';
  cancelBtn.onclick = () => overlay.remove();
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'modal-confirm';
  confirmBtn.textContent = '戻す';
  confirmBtn.onclick = () => { overlay.remove(); onConfirm(); };
  actions.appendChild(cancelBtn);
  actions.appendChild(confirmBtn);
  box.appendChild(p);
  box.appendChild(actions);
  overlay.appendChild(box);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function openEditModal(task) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal-box modal-box-wide';

  const heading = document.createElement('p');
  heading.textContent = 'タスクを編集';
  box.appendChild(heading);

  const form = document.createElement('div');
  form.className = 'edit-form';

  const titleInput = document.createElement('input');
  titleInput.type = 'text'; titleInput.value = task.title; titleInput.placeholder = 'タイトル';
  form.appendChild(titleInput);

  let editType = task.type;
  const typeRow = document.createElement('div');
  typeRow.className = 'type-toggle';
  const oneBtn = document.createElement('button');
  oneBtn.type = 'button'; oneBtn.textContent = '単発';
  oneBtn.className = 't-onetime' + (task.type === 'onetime' ? ' active' : '');
  const monBtn = document.createElement('button');
  monBtn.type = 'button'; monBtn.textContent = '月次';
  monBtn.className = 't-monthly' + (task.type === 'monthly' ? ' active' : '');
  oneBtn.onclick = () => {
    editType = 'onetime';
    oneBtn.classList.add('active'); monBtn.classList.remove('active');
    dueInput.style.display = ''; monthDayInput.style.display = 'none';
  };
  monBtn.onclick = () => {
    editType = 'monthly';
    monBtn.classList.add('active'); oneBtn.classList.remove('active');
    dueInput.style.display = 'none'; monthDayInput.style.display = '';
  };
  typeRow.appendChild(oneBtn); typeRow.appendChild(monBtn);
  form.appendChild(typeRow);

  const dueInput = document.createElement('input');
  dueInput.type = 'date'; dueInput.value = task.due || '';
  dueInput.style.display = task.type === 'monthly' ? 'none' : '';
  form.appendChild(dueInput);

  const monthDayInput = document.createElement('input');
  monthDayInput.type = 'number'; monthDayInput.min = 1; monthDayInput.max = 31; monthDayInput.placeholder = '毎月◯日';
  monthDayInput.value = task.monthDay || '';
  monthDayInput.style.display = task.type === 'monthly' ? '' : 'none';
  form.appendChild(monthDayInput);

  const prioritySelect = document.createElement('select');
  prioritySelect.innerHTML = `<option value="medium">優先度: A(重要)</option><option value="high">優先度: S(最優先)</option><option value="low">優先度: B(通常)</option>`;
  prioritySelect.value = task.priority;
  form.appendChild(prioritySelect);

  const methodInput = document.createElement('input');
  methodInput.type = 'text'; methodInput.placeholder = '方法'; methodInput.value = task.method || '';
  methodInput.setAttribute('list', 'methodOptionsEdit');
  const methodDatalist = document.createElement('datalist');
  methodDatalist.id = 'methodOptionsEdit';
  [...new Set(tasks.map(t => t.method).filter(Boolean))].forEach(m => {
    const o = document.createElement('option'); o.value = m; methodDatalist.appendChild(o);
  });
  form.appendChild(methodInput);
  form.appendChild(methodDatalist);

  const tagInput = document.createElement('input');
  tagInput.type = 'text'; tagInput.placeholder = 'タグ'; tagInput.value = task.tag || '';
  tagInput.setAttribute('list', 'tagOptionsEdit');
  const tagDatalist = document.createElement('datalist');
  tagDatalist.id = 'tagOptionsEdit';
  [...new Set(tasks.map(t => t.tag).filter(Boolean))].forEach(t => {
    const o = document.createElement('option'); o.value = t; tagDatalist.appendChild(o);
  });
  form.appendChild(tagInput);
  form.appendChild(tagDatalist);

  const submitToInput = document.createElement('input');
  submitToInput.type = 'text'; submitToInput.placeholder = '提出先'; submitToInput.value = task.submitTo || '';
  form.appendChild(submitToInput);

  box.appendChild(form);

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'modal-cancel'; cancelBtn.textContent = 'キャンセル';
  cancelBtn.onclick = () => overlay.remove();
  const saveBtn = document.createElement('button');
  saveBtn.className = 'modal-confirm'; saveBtn.textContent = '保存';
  saveBtn.onclick = () => {
    const newTitle = titleInput.value.trim();
    if (!newTitle) { titleInput.focus(); return; }
    task.title = newTitle;
    task.type = editType;
    task.due = dueInput.value;
    task.monthDay = monthDayInput.value ? parseInt(monthDayInput.value, 10) : null;
    task.priority = prioritySelect.value;
    task.method = methodInput.value.trim();
    task.tag = tagInput.value.trim();
    task.submitTo = submitToInput.value.trim();
    overlay.remove();
    saveTasks();
    render();
  };
  actions.appendChild(cancelBtn);
  actions.appendChild(saveBtn);
  box.appendChild(actions);

  overlay.appendChild(box);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function playStampEffect(ticketEl, onDone) {
  ticketEl.classList.add('stamping');
  const stamp = document.createElement('div');
  stamp.className = 'stamp stamp-anim';
  stamp.textContent = '済';
  ticketEl.appendChild(stamp);
  setTimeout(onDone, 550);
}

function render() {
  renderFilters();
  renderProgress();
  updateSelectOptions();
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const filtered = getFiltered().slice().sort((a,b) => {
    if (a.done !== b.done) return a.done - b.done;
    const order = { high: 0, medium: 1, low: 2 };
    return order[a.priority] - order[b.priority];
  });

  count.textContent = `${filtered.length} 件`;
  list.innerHTML = '';

  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `<div class="big">ここは空っぽ</div><div>新しいタスクを上のフォームから追加してください。</div>`;
    list.appendChild(empty);
    return;
  }

  filtered.forEach(task => {
    const ticket = document.createElement('div');
    ticket.className = 'ticket' + (task.done ? ' done' : '');

    const stub = document.createElement('div');
    stub.className = `stub p-${task.priority}`;
    stub.innerHTML = `<div class="stub-letter">${PRIORITY_LABEL[task.priority]}</div><div class="stub-date">${fmtDue(task)}</div>`;

    const body = document.createElement('div');
    body.className = 'body';

    const check = document.createElement('button');
    check.className = 'check' + (task.done ? ' checked' : '');
    check.onclick = () => {
      if (!task.done) {
        playStampEffect(ticket, () => {
          task.done = true;
          saveTasks();
          render();
        });
      } else {
        showConfirmModal('このタスクを未完了の状態に戻しますか?', () => {
          task.done = false;
          saveTasks();
          render();
        });
      }
    };

    const main = document.createElement('div');
    main.className = 'task-main';
    const title = document.createElement('div');
    title.className = 'task-title';
    title.textContent = task.title;
    main.appendChild(title);

    const tagRow = document.createElement('div');
    tagRow.className = 'tag-row';
    const typeTag = document.createElement('span');
    typeTag.className = `tag type-${task.type === 'monthly' ? 'monthly' : 'onetime'}`;
    typeTag.textContent = TYPE_LABEL[task.type];
    tagRow.appendChild(typeTag);
    if (task.method) {
      const mTag = document.createElement('span');
      mTag.className = 'tag';
      mTag.textContent = task.method;
      tagRow.appendChild(mTag);
    }
    if (task.tag) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = task.tag;
      tagRow.appendChild(tag);
    }
    if (task.submitTo) {
      const sTag = document.createElement('span');
      sTag.className = 'tag';
      sTag.textContent = `提出先: ${task.submitTo}`;
      tagRow.appendChild(sTag);
    }
    main.appendChild(tagRow);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const edit = document.createElement('button');
    edit.className = 'del';
    edit.title = '編集';
    edit.textContent = '✎';
    edit.onclick = () => openEditModal(task);
    actions.appendChild(edit);
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = () => { tasks = tasks.filter(t => t.id !== task.id); saveTasks(); render(); };
    actions.appendChild(del);

    const dueDate = resolveDueDate(task);
    if (dueDate) {
      const icsBtn = document.createElement('button');
      icsBtn.className = 'ics-btn';
      icsBtn.textContent = 'カレンダーに追加';
      icsBtn.onclick = () => downloadIcs(task, dueDate);
      actions.appendChild(icsBtn);
    }

    body.appendChild(check);
    body.appendChild(main);
    ticket.appendChild(stub);
    ticket.appendChild(body);
    ticket.appendChild(actions);

    if (task.done) {
      const stamp = document.createElement('div');
      stamp.className = 'stamp';
      stamp.textContent = '済';
      ticket.appendChild(stamp);
    }

    list.appendChild(ticket);
  });
}

function icsDateUTC(d) {
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}

function downloadIcs(task, dueDate) {
  const dtStart = icsDateUTC(dueDate);
  const nextDay = new Date(dueDate); nextDay.setDate(nextDay.getDate() + 1);
  const dtEnd = icsDateUTC(nextDay);
  const uid = `${task.id}@taskdesk`;
  const now = new Date();
  const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}T${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}Z`;
  const summary = task.title.replace(/[\r\n]/g, ' ');
  const desc = [task.method ? `達成方法: ${task.method}` : '', task.tag ? `タグ: ${task.tag}` : ''].filter(Boolean).join('\\n');

  let rrule = '';
  if (task.type === 'monthly') {
    rrule = `RRULE:FREQ=MONTHLY;BYMONTHDAY=${task.monthDay}\n`;
  }

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//TaskDesk//JA',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${stamp}`,
    `DTSTART;VALUE=DATE:${dtStart}`,
    `DTEND;VALUE=DATE:${dtEnd}`,
    rrule ? rrule.trim() : null,
    `SUMMARY:${summary}`,
    desc ? `DESCRIPTION:${desc}` : null,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:締め切り前日です',
    'TRIGGER:-P1D',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${summary.slice(0, 30) || 'task'}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('addBtn').onclick = () => {
  const titleEl = document.getElementById('titleInput');
  const title = titleEl.value.trim();
  if (!title) return;
  const type = selectedType;
  const priority = document.getElementById('priorityInput').value;
  const due = document.getElementById('dueInput').value;
  const monthDay = document.getElementById('monthDayInput').value ? parseInt(document.getElementById('monthDayInput').value, 10) : null;
  const method = readSelectValue('methodSelect', 'methodInput');
  const tag = readSelectValue('tagSelect', 'tagInput');
  const submitTo = document.getElementById('submitToInput').value.trim();

  tasks.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    title, type, priority, due, monthDay, method, tag, submitTo, done: false,
  });
  titleEl.value = '';
  document.getElementById('dueInput').value = '';
  document.getElementById('monthDayInput').value = '';
  document.getElementById('methodInput').value = '';
  document.getElementById('methodInput').style.display = 'none';
  document.getElementById('methodSelect').value = '';
  document.getElementById('tagInput').value = '';
  document.getElementById('tagInput').style.display = 'none';
  document.getElementById('tagSelect').value = '';
  document.getElementById('submitToInput').value = '';
  saveTasks();
  render();
};

document.getElementById('titleInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
});

loadTasks();
</script>
